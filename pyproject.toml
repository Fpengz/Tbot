[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbot"
version = "0.1.0"
description = "Research-first crypto trading system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "typer>=0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
tbot = "tbot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
data = ["duckdb>=1.0", "polars>=1.0", "pyarrow>=17.0"]
live-data = ["websockets>=13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "httpx2>=1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.71",
    "websockets>=17.0.1",
]
