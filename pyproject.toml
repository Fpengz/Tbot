[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbot"
version = "0.1.0"
description = "Research-first crypto trading system"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1.0"]

[project.scripts]
tbot = "tbot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
data = ["duckdb>=1.0", "polars>=1.0", "pyarrow>=17.0"]
live-data = ["websockets>=13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
